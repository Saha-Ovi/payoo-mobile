<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo | Home</title>

    <!-- favicon -->
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />

    <!-- DaisyUI + tailwind -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- internal CSS -->
    <style>
      * {
        font-family: "Outfit", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen max-w-md mx-auto bg-base-200">
    <header class="border-b-2 border-gray-300">
      <section class="w-11/12 mx-auto flex justify-between items-center py-3">
        <div class="left flex gap-2">
          <div class="w-[60px]">
            <img src="./assets/logo.png" alt="" />
          </div>
          <div>
            <h2 class="text-3xl font-bold text-neutral">
              $<span id="balance">45000</span>
            </h2>
            <p class="text-neutral/50">Available Balance</p>
          </div>
        </div>
        <div class="right btn btn-soft">
          <a href="./index.html"
            ><i class="fa-solid fa-arrow-right-from-bracket"></i>Logout</a
          >
        </div>
      </section>
    </header>
    <main>
      <!-- Button List -->
      <section class="w-11/12 mx-auto py-4">
        <div class="space-y-6">
          <h2 class="font-bold text-2xl">
            Welcome to Pay<span class="text-primary">oo</span>
          </h2>
          <p class="text-neutral/50">
            Enjoy easy and convenient financial services with us. Cashout charge
            is low and
          </p>
        </div>

        <div class="grid grid-cols-3 gap-3 py-4">
          <button
            onclick="showOnly('add-money')"
            class="btn btn-primary btn-soft flex-col h-full p-3 rounded-lg"
          >
            <img src="./assets/opt-1.png" alt="" />
            <p>Add Money</p>
          </button>
          <button
            onclick="showOnly('cashout')"
            class="btn btn-primary btn-soft flex-col h-full p-3 rounded-lg"
          >
            <img src="./assets/opt-2.png" alt="" />
            <p>Cashout</p>
          </button>
          <button onclick="showOnly('transfer-money')"
            class="btn btn-primary btn-soft flex-col h-full p-3 rounded-lg"
          >
            <img src="./assets/opt-3.png" alt="" />
            <p>Transfer Money</p>
          </button>
          <button
            class="btn btn-primary btn-soft flex-col h-full p-3 rounded-lg"
          >
            <img src="./assets/opt-4.png" alt="" />
            <p>Get Bonus</p>
          </button>
          <button
            class="btn btn-primary btn-soft flex-col h-full p-3 rounded-lg"
          >
            <img src="./assets/opt-5.png" alt="" />
            <p>Pay Bill</p>
          </button>
          <button onclick="showOnly('transactions-history')"
            class="btn btn-primary btn-soft flex-col h-full p-3 rounded-lg"
          >
            <img src="./assets/opt-6.png" alt="" />
            <p>Transactions</p>
          </button>
        </div>
      </section>

      <!-- Add money section -->
      <section id="add-money" class="w-11/12 mx-auto py-4">
        <h2 class="font-semibold text-neutral/90 text-xl">Add Money</h2>
        <div class="form pt-10">
          <div class="card bg-base-100 w-full shadow rounded-2xl">
            <div class="card-body">
              <fieldset class="fieldset">
                <label class="label text-neutral font-bold"
                  >Select A Bank</label
                >
                <select
                  id="add-money-bank"
                  class="select w-full rounded-full bg-base-200"
                >
                  <option disabled selected>Select back</option>
                  <option value="DBBL">DBBL</option>
                  <option value="City">City Bank</option>
                  <option value="UCB">UCB</option>
                </select>
                <br />

                <label class="label text-neutral font-bold"
                  >Bank Account Number</label
                >
                <input
                  id="add-money-number"
                  maxlength="11"
                  minlength="11"
                  type="text"
                  class="input w-full bg-base-200 rounded-full"
                  placeholder="Enter 11 digit account number"
                />
                <br />
                <label class="label text-neutral font-bold"
                  >Amount to Add</label
                >
                <input
                  id="add-money-amount"
                  type="number"
                  class="input w-full bg-base-200 rounded-full"
                  placeholder="Add Amount to withdraw"
                />
                <br />

                <label class="label text-neutral font-bold">PIN Number</label>
                <input
                  id="add-money-pin"
                  maxlength="4"
                  type="password"
                  class="input bg-base-200 w-full rounded-full"
                  placeholder="Enter your 4 digit PIN"
                />

                <button
                  id="add-money-btn"
                  class="btn btn-primary rounded-full mt-4 p-6"
                >
                  Add Money
                </button>
              </fieldset>
            </div>
          </div>
        </div>
      </section>

      <!-- cash out section -->
      <section id="cashout" class="w-11/12 mx-auto py-4">
        <h2 class="font-semibold text-neutral/90 text-xl">Cashout</h2>
        <div class="form pt-10">
          <div class="card bg-base-100 w-full shadow rounded-2xl">
            <div class="card-body">
              <fieldset class="fieldset">
                <label class="label text-neutral font-bold">Agent Number</label>
                <input
                  id="cashout-number"
                  maxlength="11"
                  minlength="11"
                  type="text"
                  class="input w-full bg-base-200 rounded-full"
                  placeholder="Enter your 11 digit Agent number"
                />
                <br />
                <label class="label text-neutral font-bold">Amount</label>
                <input
                  id="cashout-amount"
                  type="number"
                  class="input w-full bg-base-200 rounded-full"
                  placeholder="Enter amount to withdraw"
                />
                <br />

                <label class="label text-neutral font-bold">PIN Number</label>
                <input
                  id="cashout-pin"
                  maxlength="4"
                  type="password"
                  class="input bg-base-200 w-full rounded-full"
                  placeholder="Enter your 4 digit PIN"
                />

                <button
                  id="cashout-btn"
                  class="btn btn-primary rounded-full mt-4 p-6"
                >
                  Withdraw Money
                </button>
              </fieldset>
            </div>
          </div>
        </div>
      </section>
      <!-- Transfer Money section -->
      <section id="transfer-money" class="w-11/12 mx-auto py-4">
        <h2 class="font-semibold text-neutral/90 text-xl">Transfer Money</h2>
        <div class="form pt-10">
          <div class="card bg-base-100 w-full shadow rounded-2xl">
            <div class="card-body">
              <fieldset class="fieldset">
                <label class="label text-neutral font-bold">User Account Number</label>
                <input
                  id="transfer-money-number"
                  maxlength="11"
                  minlength="11"
                  type="text"
                  class="input w-full bg-base-200 rounded-full"
                  placeholder="Enter your 11 digit number"
                />
                <br />
                <label class="label text-neutral font-bold">Amount</label>
                <input
                  id="transfer-money-amount"
                  type="number"
                  class="input w-full bg-base-200 rounded-full"
                  placeholder="Enter amount to transfer"
                />
                <br />

                <label class="label text-neutral font-bold">PIN Number</label>
                <input
                  id="transfer-money-pin"
                  maxlength="4"
                  type="password"
                  class="input bg-base-200 w-full rounded-full"
                  placeholder="Enter your 4 digit PIN"
                />

                <button
                  id="transfer-money-btn"
                  class="btn btn-primary rounded-full mt-4 p-6"
                >
                  Send Now
                </button>
              </fieldset>
            </div>
          </div>
        </div>
      </section>

      <!-- Transaction History -->
      <section class="w-11/12 mx-auto py-4" id="transactions-history">
        <h2 class="font-semibold text-neutral/90 text-xl">Transactions</h2>
        <div class="py-4" id="transactions-history-container">
         
        </div>
      </section>
    </main>
    <script src="./scripitJS/machine.js"></script>
    <script src="scripitJS/add-money.js"></script>
    <script src="./scripitJS/cashout.js"></script>
    <script src="./scripitJS/transfer-money.js"></script>
  </body>
</html>
